# Ten-node syncfs mesh on one Podman network.
#
#   make run-image            # from the repository root, builds localhost/syncfs
#   ./demo.sh                 # scripted walkthrough, or by hand:
#   mkdir -p data/node{01..10} && podman compose up -d
#
# Service names (node01..node10) are the DNS names the peers/* files point at,
# and each node publishes its own name as its listen address, so the address a
# peer dials and the identity a node announces are the same string.
#
# Each node gets:
#   /peers  read-only list of the other nine nodes
#   /data   its own host directory, read-write: watch them converge from here
#
# keep-id maps the user owning ./data onto the image's syncfs user (uid 1000);
# without it the daemon cannot write into /data.

x-node: &node
  image: localhost/syncfs
  userns_mode: "keep-id:uid=1000"
  restart: unless-stopped
  networks:
    - mesh

services:
  node01:
    <<: *node
    container_name: syncfs-node01
    hostname: node01
    command: ["/peers", "node01:5555"]
    volumes:
      - ./peers/node01:/peers:ro,Z
      - ./data/node01:/data:rw,Z

  node02:
    <<: *node
    container_name: syncfs-node02
    hostname: node02
    command: ["/peers", "node02:5555"]
    volumes:
      - ./peers/node02:/peers:ro,Z
      - ./data/node02:/data:rw,Z

  node03:
